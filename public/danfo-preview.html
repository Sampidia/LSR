<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lagos Street Race &mdash; Player Vehicle & Hangar Preview</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#080811;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,monospace;color:#fff}
    canvas{position:fixed;top:0;left:0;z-index:1}
    
    /* Top Bar */
    #ui{position:fixed;top:0;left:0;right:0;z-index:10;padding:14px 22px;
        display:flex;align-items:center;justify-content:space-between;pointer-events:none;
        background:linear-gradient(180deg,rgba(0,0,0,.92) 0%,transparent 100%)}
    #ui h1{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#f5c518;display:flex;align-items:center;gap:8px}
    #ui p{font-size:10px;color:#8892b0;margin-top:2px}
    
    .badge-wrap{display:flex;gap:8px;align-items:center}
    #badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
           padding:4px 14px;border-radius:999px;
           background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.4);color:#f5c518}
    #stats{font-size:10px;color:#00e5ff;padding:4px 12px;border-radius:999px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.3)}

    /* Section Switcher (Player vs Traffic) */
    #section-switch{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:10;
                    display:flex;gap:6px;background:rgba(10,12,22,.85);backdrop-filter:blur(12px);
                    padding:4px;border-radius:999px;border:1px solid rgba(255,255,255,.15)}
    .sec-btn{padding:7px 18px;border-radius:999px;border:none;background:transparent;color:#8892b0;
             font:700 10px monospace;letter-spacing:.08em;cursor:pointer;transition:.2s}
    .sec-btn.active{background:#f5c518;color:#000;box-shadow:0 0 16px rgba(245,197,24,.45)}

    /* Bottom Thruster Controls (for Player Cars) */
    #thruster-bar{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);
                  display:flex;gap:6px;z-index:10;align-items:center;background:rgba(10,12,22,.88);
                  backdrop-filter:blur(14px);padding:6px 14px;border-radius:12px;border:1px solid rgba(0,229,255,.35)}
    .th-btn{padding:6px 12px;border-radius:6px;border:1px solid rgba(0,229,255,.35);
            background:rgba(0,229,255,.08);color:#00e5ff;font:700 9px monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.15s}
    .th-btn:hover,.th-btn.active{background:#00e5ff;color:#000;box-shadow:0 0 14px rgba(0,229,255,.55)}
    .th-label{font:700 9px monospace;color:#8892b0;letter-spacing:.08em;margin-right:4px}

    /* Vehicle Selection Tabs */
    #tabs{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
          display:flex;gap:6px;z-index:10;flex-wrap:wrap;justify-content:center;max-width:96vw}
    .tab{padding:7px 16px;border-radius:999px;border:1px solid rgba(245,197,24,.4);
         background:rgba(245,197,24,.08);color:#f5c518;font:700 9px monospace;
         letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.2s}
    .tab:hover,.tab.on{background:#f5c518;color:#000;box-shadow:0 0 16px rgba(245,197,24,.45)}

    #road-dir{position:fixed;bottom:115px;left:50%;transform:translateX(-50%);
              font-size:9px;color:#00e5ff;letter-spacing:.2em;text-transform:uppercase;z-index:10;pointer-events:none}
    #hint{position:fixed;top:62px;right:22px;font-size:9px;color:#667;letter-spacing:.1em;text-transform:uppercase;z-index:10;pointer-events:none}
    #status{position:fixed;top:90px;left:22px;font-size:11px;z-index:10;pointer-events:none;white-space:pre-line;line-height:1.5}
  </style>
</head>
<body>
<div id="ui">
  <div>
    <h1>&#x1F680; Lagos Street Race &mdash; Player Hangar & Vehicle Preview</h1>
    <p>Authentic Game Engine Roadster &middot; Side-Rocket FX &middot; 100% Physics Matched</p>
  </div>
  <div class="badge-wrap">
    <div id="stats">Physics: 1.9m &times; 1.45m &times; 4.4m &middot; Ground: 0.55m</div>
    <div id="badge">Hangar Ready</div>
  </div>
</div>

<div id="section-switch">
  <button class="sec-btn active" id="sec-player" onclick="setSection('player')">&#x1F680; Player Hangar (3 Vehicles)</button>
  <button class="sec-btn" id="sec-traffic" onclick="setSection('traffic')">&#x1F698; Highway Traffic (10 Vehicles)</button>
</div>

<div id="status" style="color:#f5c518"></div>
<div id="road-dir">&uarr; HIGHWAY TRAVELS DOWNSTREAM (-Z) &uarr;</div>

<!-- Thruster Test Bar (Active for Player Cars) -->
<div id="thruster-bar">
  <span class="th-label">Thruster FX:</span>
  <button class="th-btn active" id="btn-idle" onclick="setThrustMode('idle')">Hover Idle</button>
  <button class="th-btn" id="btn-cruise" onclick="setThrustMode('cruise')">Cruise</button>
  <button class="th-btn" id="btn-boost" onclick="setThrustMode('boost')">&#x1F525; Nitro Boost</button>
  <button class="th-btn" id="btn-vtol" onclick="setThrustMode('vtol')">&#x1F6F8; VTOL Jump</button>
  <button class="th-btn" id="btn-roll-l" onclick="setThrustMode('rollL')">&#x21B6; Roll Left</button>
  <button class="th-btn" id="btn-roll-r" onclick="setThrustMode('rollR')">&#x21B7; Roll Right</button>
  <button class="th-btn" style="border-color:#fff;color:#fff" onclick="toggleFlip()">Flip 180&deg;</button>
</div>

<div id="tabs"></div>
<div id="hint">Drag to orbit &middot; Scroll to zoom</div>

<script src="/assets/three-gltf.js"></script>
<script>
(function(){
  var st  = document.getElementById('status');
  var bdg = document.getElementById('badge');
  var statsEl = document.getElementById('stats');
  function log(m,c){ st.style.color=c||'#0f0'; st.textContent=m; }

  if(typeof ThreeGLTF==='undefined'){ log('ERROR: three-gltf.js not loaded','#f44'); return; }
  var THREE = ThreeGLTF;
  var GL    = THREE.GLTFLoader;

  /* ── Renderer ─────────────────────────────────────────────────────── */
  var renderer = new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  if(THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
  if(THREE.ACESFilmicToneMapping){ renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.4; }
  renderer.shadowMap.enabled = true;
  if(THREE.PCFSoftShadowMap) renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  /* ── Scene / Camera ───────────────────────────────────────────────── */
  var scene  = new THREE.Scene();
  scene.background = new THREE.Color(0x080811);
  scene.fog = new THREE.FogExp2(0x080811, 0.014);
  var camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(6, 3.8, 9.5); camera.lookAt(0, 1.0, 0);

  /* ── Sky env map ──────────────────────────────────────────────────── */
  var ec=document.createElement('canvas'); ec.width=512; ec.height=256;
  var ex=ec.getContext('2d');
  var skyG=ex.createLinearGradient(0,0,0,256);
  skyG.addColorStop(0,'#0a1428'); skyG.addColorStop(0.4,'#1c3060');
  skyG.addColorStop(0.7,'#b06820'); skyG.addColorStop(1,'#1a0800');
  ex.fillStyle=skyG; ex.fillRect(0,0,512,256);
  var sunG=ex.createRadialGradient(256,160,2,256,160,60);
  sunG.addColorStop(0,'rgba(255,240,170,1)'); sunG.addColorStop(1,'rgba(255,140,30,0)');
  ex.fillStyle=sunG; ex.fillRect(0,0,512,256);
  var envTex=new THREE.CanvasTexture(ec);
  if(THREE.EquirectangularReflectionMapping) envTex.mapping=THREE.EquirectangularReflectionMapping;
  scene.environment=envTex;

  /* ── Lights ───────────────────────────────────────────────────────── */
  scene.add(new THREE.AmbientLight(0x405075, 2.6));
  var sun=new THREE.DirectionalLight(0xfff5e0, 4.2);
  sun.position.set(10, 20, 10); sun.castShadow=true;
  if(sun.shadow) sun.shadow.mapSize.width = sun.shadow.mapSize.height = 1024;
  scene.add(sun);
  var fill=new THREE.DirectionalLight(0x3060d0, 1.6);
  fill.position.set(-12, 5, -8); scene.add(fill);
  var groundGlow=new THREE.PointLight(0x00e5ff, 2.5, 12);
  groundGlow.position.set(0, 0.2, 0); scene.add(groundGlow);

  /* ── Ground Highway ───────────────────────────────────────────────── */
  var ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),
    new THREE.MeshStandardMaterial({color:0x12151c,roughness:0.85,metalness:0.12}));
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

  // 4m Lanes
  for(var li=-2; li<=2; li++){
    var lane=new THREE.Mesh(new THREE.PlaneGeometry(0.15, 36),
      new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.18}));
    lane.rotation.x=-Math.PI/2; lane.position.set(li*4.0, 0.002, 0); scene.add(lane);
  }
  var arrowDir = new THREE.ArrowHelper(new THREE.Vector3(0,0,-1), new THREE.Vector3(0,0.01,5), 10, 0x00e5ff, 1.4, 0.7);
  scene.add(arrowDir);

  /* ── EXACT ROADSTER IMPLEMENTATION FROM GAME ENGINE (cm & lm) ──────── */
  // Extracted verbatim from index-DZDTu90F.js so the original player car is 100% authentic
  var sm = null;
  function cm(){
    if(sm) return sm;
    var e = new THREE.MeshStandardMaterial({color:15659508, roughness:.28, metalness:.15}); // Pearl White chassis
    var t = new THREE.MeshStandardMaterial({color:1250584, roughness:.6});                 // Dark carbon splitter
    var n = new THREE.MeshStandardMaterial({color:3813140, roughness:.12, metalness:.6, emissive:13214282, emissiveIntensity:.18}); // Glass canopy
    var r = new THREE.MeshStandardMaterial({color:1974308, roughness:.5, metalness:.3});   // Rims/rubber
    var i = new THREE.MeshStandardMaterial({color:15596028, emissive:15596028, emissiveIntensity:2}); // Headlight
    var a = new THREE.MeshStandardMaterial({color:16717872, emissive:16717872, emissiveIntensity:2.2}); // Red taillight
    var o = new THREE.MeshBasicMaterial({color:6288127, transparent:true, opacity:.85, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}); // Cyan thruster plume
    var s = new THREE.CylinderGeometry(.2, 1.6, 12, 1, true);
    s.rotateX(Math.PI);
    s.translate(0, -.8, 0);
    sm = {
      body: e, carbon: t, glass: n, wheel: r, head: i, tail: a, plume: o, cone: s,
      wheelGeo: new THREE.CylinderGeometry(.36, .36, .3, 18).rotateZ(Math.PI / 2)
    };
    return sm;
  }

  function lm(){
    var e = cm(), t = new THREE.Group();
    t.name = 'Roadster_Original';
    var n = function(geo, mat, x, y, z){
      var obj = new THREE.Mesh(geo, mat);
      obj.position.set(x, y, z);
      t.add(obj);
      return obj;
    };
    var r = new THREE.BoxGeometry(1.95, .5, 4.3, 1, 1, 2);
    var i = r.attributes.position;
    for(var j = 0; j < i.count; j++){
      var z = i.getZ(j), y = i.getY(j);
      if(z < -1 && y > 0) i.setY(j, y - .28);
      if(z < -1) i.setX(j, i.getX(j) * .86);
    }
    r.computeVertexNormals();
    n(r, e.body, 0, .5, 0);

    var a = new THREE.SphereGeometry(.75, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2);
    a.scale(1.05, .62, 2.1);
    n(a, e.glass, 0, .72, .2);
    n(new THREE.BoxGeometry(2, .1, 4), e.carbon, 0, .2, 0);
    n(new THREE.BoxGeometry(1.6, .05, .05), e.head, 0, .55, -2.13);
    var o = n(new THREE.BoxGeometry(1.9, .06, .05), e.tail, 0, .7, 2.16);

    var s = [];
    for(var pair of [[-.92, -1.35], [.92, -1.35], [-.92, 1.4], [.92, 1.4]]){
      var grp = new THREE.Group();
      grp.position.set(pair[0], .36, pair[1]);
      grp.add(new THREE.Mesh(e.wheelGeo, e.wheel));
      var guard = new THREE.Mesh(new THREE.BoxGeometry(.31, .12, .5), e.carbon);
      grp.add(guard);
      t.add(grp);
      s.push(grp);
    }

    var c = {}, l = null;
    var u = function(x, y, z, rx, rz){
      var g = new THREE.Group();
      g.position.set(x, y, z);
      g.rotation.set(rx, 0, rz);
      var coneMesh = new THREE.Mesh(e.cone, l);
      g.add(coneMesh);
      g.scale.set(0, 0, 0);
      t.add(g);
      return g;
    };
    var d = function(k){ return l = c[k] = e.plume.clone(); };
    var f = {};
    d('rear'); f.rear = [u(-.35, .45, 2.2, -Math.PI / 2, 0), u(.35, .45, 2.2, -Math.PI / 2, 0)];
    d('down'); f.down = [u(-.6, .18, -.9, 0, 0), u(.6, .18, -.9, 0, 0), u(-.6, .18, 1, 0, 0), u(.6, .18, 1, 0, 0)];
    d('left'); f.left = [u(-1, .45, -1.6, 0, -Math.PI / 2), u(-1, .45, 1.6, 0, -Math.PI / 2)];
    d('right'); f.right = [u(1, .45, -1.6, 0, Math.PI / 2), u(1, .45, 1.6, 0, Math.PI / 2)];

    for(var k in f){
      for(var pl of f[k]) pl.userData.baseScale = new THREE.Vector3(1, 1, 1);
    }

    t.userData = {
      plumes: f,
      wheels: s,
      lightBar: o,
      headlights: null,
      body: t.children[0],
      plumeMats: c
    };
    return t;
  }

  /* ── EXACT PLUME ANIMATION FUNCTION FROM GAME ENGINE (om) ────────── */
  // Directly controls plume extension, radius, and opacity based on engine thrust
  function om(plumes, thrust, mats, rMult, iMult){
    if(!plumes) return;
    rMult = rMult || 1; iMult = iMult || 1;
    var a = thrust > 0.02;
    var o = a ? (0.25 + thrust * 0.85) * rMult : 0;
    var s = a ? (0.55 + thrust * 0.45) * iMult : 0;

    for(var i = 0; i < plumes.length; i++){
      var n = plumes[i];
      var base = n.userData.baseScale || new THREE.Vector3(1, 1, 1);
      if(a){
        n.visible = true;
        n.scale.set(base.x * s, base.y * o, base.z * s);
      } else {
        n.scale.set(1e-4, 1e-4, 1e-4);
        n.visible = false;
      }
    }
    if(mats){
      var matArr = Array.isArray(mats) ? mats : [mats];
      for(var m of matArr){
        if(m) m.opacity = Math.min(1.0, 0.4 + thrust * 0.55);
      }
    }
  }

  /* ── ATTACH SIDE ROCKET PLUMES TO NEW FLYING VEHICLES ────────────── */
  // Uses the exact same plume materials and geometry as the game's roadster
  function attachSideRockets(root, config){
    var e = cm();
    var c = {}, l = null;
    var d = function(k){ return l = c[k] = e.plume.clone(); };
    var f = {};

    var u = function(pos, rx, rz){
      var g = new THREE.Group();
      g.position.copy(pos);
      g.rotation.set(rx, 0, rz);
      var coneMesh = new THREE.Mesh(e.cone, l);
      g.add(coneMesh);
      g.scale.set(0, 0, 0);
      root.add(g);
      g.userData.baseScale = new THREE.Vector3(1.2, 1.2, 1.2);
      return g;
    };

    // Twin Rear Rocket Exhausts
    d('rear');
    f.rear = [
      u(config.rearL, -Math.PI / 2, 0),
      u(config.rearR, -Math.PI / 2, 0)
    ];

    // Under-Pod Downward VTOL Hover Jets
    d('down');
    f.down = [
      u(config.downL, 0, 0),
      u(config.downR, 0, 0)
    ];

    // Lateral RCS Maneuver Nozzles
    d('left');
    f.left = [u(config.rcsL, 0, -Math.PI / 2)];
    d('right');
    f.right = [u(config.rcsR, 0, Math.PI / 2)];

    return { plumes: f, plumeMats: c };
  }

  /* ── Vehicle Catalogs ────────────────────────────────────────────── */
  var PLAYER_VEHICLES = [
    {
      name: 'Flying T (Original)',
      key: 'flying_t',
      isOriginal: true,
      create: lm,
      desc: 'Authentic Game Roadster · 4 Underbody Exhausts · Copied Verbatim From Engine'
    },
    {
      name: 'Flying Danfo',
      key: 'flying_danfo',
      url: '/assets/flying_danfo_opt.glb',
      len: 4.8,
      rotY: 0,
      rocketConfig: {
        rearL: new THREE.Vector3(-1.25, 0.75, 1.8),
        rearR: new THREE.Vector3( 1.25, 0.75, 1.8),
        downL: new THREE.Vector3(-1.25, 0.35, 0.2),
        downR: new THREE.Vector3( 1.25, 0.35, 0.2),
        rcsL:  new THREE.Vector3(-1.35, 0.85, 0.3),
        rcsR:  new THREE.Vector3( 1.35, 0.85, 0.3)
      },
      desc: 'Lagos Danfo · Twin Heavy Side Rocket Pods · Matched 100% to Roadster Physics'
    },
    {
      name: 'Flying Tortoise Car',
      key: 'flying_tortoise',
      url: '/assets/flying_tortoise_car_opt.glb',
      len: 4.5,
      rotY: Math.PI / 2,
      rocketConfig: {
        rearL: new THREE.Vector3(-1.18, 0.55, 1.7),
        rearR: new THREE.Vector3( 1.18, 0.55, 1.7),
        downL: new THREE.Vector3(-1.18, 0.28, 0.1),
        downR: new THREE.Vector3( 1.18, 0.28, 0.1),
        rcsL:  new THREE.Vector3(-1.28, 0.60, 0.2),
        rcsR:  new THREE.Vector3( 1.28, 0.60, 0.2)
      },
      desc: 'Aerodynamic Jet Pods · High Agility Lateral Nozzles · Matched 100% to Roadster Physics'
    }
  ];

  var TRAFFIC_VEHICLES = [
    { name: 'Danfo Bus',       url: '/assets/lagos_danfo_bus_opt.glb',      len: 5.2,  rotY: Math.PI / 2 },
    { name: 'VW T3 Vanagon',   url: '/assets/volkswagen_t3_opt.glb',         len: 5.0,  rotY: 147 * Math.PI / 180 },
    { name: 'Toyota Corolla',  url: '/assets/2006_toyota_corolla.glb',       len: 4.6,  rotY: Math.PI },
    { name: 'Luxel Taxi',      url: '/assets/2005_toyota_corolla_luxel.glb', len: 4.6,  rotY: Math.PI },
    { name: 'Car Carrier',     url: '/assets/truck_car_carrier_opt.glb',     len: 14.0, rotY: 3 * Math.PI / 2 },
    { name: 'Box Truck',       url: '/assets/truck_opt.glb',                 len: 7.5,  rotY: Math.PI / 2 },
    { name: 'Cement Truck',    url: '/assets/cement_truck_opt.glb',          len: 8.0,  rotY: 3 * Math.PI / 2 },
    { name: 'Pickup Truck',    url: '/assets/pick_up_vechile_opt.glb',       len: 5.4,  rotY: 3 * Math.PI / 2 },
    { name: 'Highlander',      url: '/assets/highlander_opt.glb',            len: 4.8,  rotY: Math.PI / 2 },
    { name: 'SUV Car',         url: '/assets/suv_car_opt.glb',               len: 4.8,  rotY: Math.PI / 2 }
  ];

  var activeSection = 'player';
  var activePlayerIdx = 0;
  var activeTrafficIdx = 0;
  var loadedPlayerModels = {};
  var loadedTrafficModels = {};
  var pivot = new THREE.Group(); scene.add(pivot);

  var thrustMode = 'idle'; // idle, cruise, boost, vtol, rollL, rollR

  /* ── UI Builders ─────────────────────────────────────────────────── */
  function renderTabs(){
    var tabsWrap = document.getElementById('tabs');
    tabsWrap.innerHTML = '';
    var list = (activeSection === 'player') ? PLAYER_VEHICLES : TRAFFIC_VEHICLES;
    var activeIdx = (activeSection === 'player') ? activePlayerIdx : activeTrafficIdx;

    list.forEach(function(v, i){
      var btn = document.createElement('button');
      btn.className = 'tab' + (i === activeIdx ? ' on' : '');
      btn.textContent = v.name;
      btn.onclick = function(){ selectVehicle(i); };
      tabsWrap.appendChild(btn);
    });

    document.getElementById('thruster-bar').style.display = (activeSection === 'player') ? 'flex' : 'none';
  }

  window.setSection = function(sec){
    activeSection = sec;
    document.getElementById('sec-player').classList.toggle('active', sec === 'player');
    document.getElementById('sec-traffic').classList.toggle('active', sec === 'traffic');
    renderTabs();
    selectVehicle(sec === 'player' ? activePlayerIdx : activeTrafficIdx);
  };

  window.setThrustMode = function(mode){
    thrustMode = mode;
    ['idle','cruise','boost','vtol','rollL','rollR'].forEach(function(m){
      var btn = document.getElementById('btn-' + (m==='rollL'?'roll-l':m==='rollR'?'roll-r':m));
      if(btn) btn.classList.toggle('active', m === mode);
    });
  };

  /* ── Load & Display Vehicle ──────────────────────────────────────── */
  function selectVehicle(idx){
    while(pivot.children.length) pivot.remove(pivot.children[0]);
    if(activeSection === 'player'){
      activePlayerIdx = idx;
      renderTabs();
      var def = PLAYER_VEHICLES[idx];
      bdg.textContent = def.name;
      statsEl.textContent = def.desc;

      if(def.isOriginal){
        if(!loadedPlayerModels[def.key]) loadedPlayerModels[def.key] = def.create();
        pivot.add(loadedPlayerModels[def.key]);
        return;
      }

      if(loadedPlayerModels[def.key]){
        pivot.add(loadedPlayerModels[def.key]);
        return;
      }

      log('Loading ' + def.name + ' (' + def.url + ')...');
      new GL().load(def.url, function(gltf){
        var root = gltf.scene;
        root.rotation.y = def.rotY;
        root.position.set(0,0,0);
        root.scale.set(1,1,1);
        root.updateMatrixWorld(true);

        var bb = new THREE.Box3().setFromObject(root);
        var sz = new THREE.Vector3(); bb.getSize(sz);
        var sc = def.len / Math.max(sz.z, 0.001);
        root.scale.set(sc, sc, sc);
        root.updateMatrixWorld(true);

        var bb2 = new THREE.Box3().setFromObject(root);
        root.position.y = -bb2.min.y;
        root.position.x = -(bb2.min.x + bb2.max.x) / 2;
        root.position.z = -(bb2.min.z + bb2.max.z) / 2;
        root.updateMatrixWorld(true);

        root.traverse(function(c){
          if(c.isMesh){ c.castShadow = true; c.receiveShadow = false; }
        });

        // Attach Side Rocket Thrusters (exact engine plume geometry)
        var res = attachSideRockets(root, def.rocketConfig);
        root.userData = {
          type: 'player',
          plumes: res.plumes,
          plumeMats: res.plumeMats,
          dims: { w: sz.x * sc, h: sz.y * sc, l: def.len },
          roofHeight: sz.y * sc,
          isPlayer: true
        };

        loadedPlayerModels[def.key] = root;
        pivot.add(root);
        log('Loaded ' + def.name + ' \u2713', '#0f0');
        setTimeout(function(){ st.style.display='none'; }, 1500);
      });
    } else {
      activeTrafficIdx = idx;
      renderTabs();
      var def = TRAFFIC_VEHICLES[idx];
      bdg.textContent = def.name;
      statsEl.textContent = 'Traffic: Length ' + def.len + 'm · RotY: ' + (def.rotY*180/Math.PI).toFixed(0) + '°';

      if(loadedTrafficModels[def.name]){
        pivot.add(loadedTrafficModels[def.name]);
        return;
      }

      log('Loading ' + def.name + '...');
      new GL().load(def.url, function(gltf){
        var root = gltf.scene;
        root.rotation.y = def.rotY;
        root.position.set(0,0,0);
        root.scale.set(1,1,1);
        root.updateMatrixWorld(true);

        var bb = new THREE.Box3().setFromObject(root);
        var sz = new THREE.Vector3(); bb.getSize(sz);
        var sc = def.len / Math.max(sz.z, 0.001);
        root.scale.set(sc, sc, sc);
        root.updateMatrixWorld(true);

        var bb2 = new THREE.Box3().setFromObject(root);
        root.position.y = -bb2.min.y;
        root.position.x = -(bb2.min.x + bb2.max.x) / 2;
        root.position.z = -(bb2.min.z + bb2.max.z) / 2;
        root.updateMatrixWorld(true);

        root.traverse(function(c){
          if(c.isMesh){ c.castShadow = true; c.receiveShadow = false; }
        });

        loadedTrafficModels[def.name] = root;
        pivot.add(root);
        log('Loaded ' + def.name + ' \u2713', '#0f0');
        setTimeout(function(){ st.style.display='none'; }, 1500);
      });
    }
  }

  window.toggleFlip = function(){
    var curr = (activeSection === 'player') ? loadedPlayerModels[PLAYER_VEHICLES[activePlayerIdx].key] : loadedTrafficModels[TRAFFIC_VEHICLES[activeTrafficIdx].name];
    if(!curr) return;
    curr.rotation.y = (curr.rotation.y + Math.PI) % (2 * Math.PI);
    bdg.textContent += ' [Flipped 180°: ' + (curr.rotation.y*180/Math.PI).toFixed(0) + '°]';
  };

  /* ── Orbit Controls ──────────────────────────────────────────────── */
  var drag=false, lx=0, ly=0, az=0.6, el=0.25, rad=12;
  renderer.domElement.addEventListener('mousedown',function(e){drag=true;lx=e.clientX;ly=e.clientY;});
  window.addEventListener('mouseup',function(){drag=false;});
  window.addEventListener('mousemove',function(e){
    if(!drag)return;
    az-=(e.clientX-lx)*0.006; el-=(e.clientY-ly)*0.004;
    el=Math.max(0.06,Math.min(1.2,el)); lx=e.clientX; ly=e.clientY;
  });
  renderer.domElement.addEventListener('wheel',function(e){
    rad=Math.max(3,Math.min(32,rad+e.deltaY*0.015));
  });
  window.addEventListener('resize',function(){
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  /* ── Animate Engine Plumes with Exact om() Physics ───────────────── */
  var clk = new THREE.Clock();
  (function frame(){
    requestAnimationFrame(frame);
    var dt = clk.getDelta(), t = clk.getElapsedTime();

    camera.position.set(Math.sin(az)*Math.cos(el)*rad, Math.sin(el)*rad+0.6, Math.cos(az)*Math.cos(el)*rad);
    camera.lookAt(0, 1.1, 0);

    // Dynamic Hover Floating (Physics simulation)
    if(activeSection === 'player'){
      pivot.position.y = (thrustMode === 'vtol' ? 1.4 : 0.0) + Math.sin(t * 3.5) * 0.018;
      
      // Roll banking tilt simulation
      if(thrustMode === 'rollL') pivot.rotation.z = THREE.MathUtils.lerp(pivot.rotation.z, 0.35, 0.1);
      else if(thrustMode === 'rollR') pivot.rotation.z = THREE.MathUtils.lerp(pivot.rotation.z, -0.35, 0.1);
      else pivot.rotation.z = THREE.MathUtils.lerp(pivot.rotation.z, 0, 0.1);

      // Current active model's plumes
      var currentModel = loadedPlayerModels[PLAYER_VEHICLES[activePlayerIdx].key];
      if(currentModel && currentModel.userData && currentModel.userData.plumes){
        var plumes = currentModel.userData.plumes;
        var plumeMats = currentModel.userData.plumeMats || {};
        var jitter = 1 + Math.sin(t * 45) * 0.08;

        // Thrust intensity mapping
        var rearIntensity = (thrustMode === 'boost') ? 1.0 : (thrustMode === 'cruise') ? 0.6 : 0.12;
        var downIntensity = (thrustMode === 'vtol') ? 1.0 : 0.0;
        var leftIntensity = (thrustMode === 'rollL') ? 1.0 : 0.0;
        var rightIntensity = (thrustMode === 'rollR') ? 1.0 : 0.0;

        // Animate via exact game engine om() function
        om(plumes.rear,  rearIntensity * jitter,  plumeMats.rear,  1.35, 1.45);
        om(plumes.down,  downIntensity * jitter,  plumeMats.down,  1.8,  1.3);
        om(plumes.left,  leftIntensity * jitter,  plumeMats.left,  1.4,  1.2);
        om(plumes.right, rightIntensity * jitter, plumeMats.right, 1.4,  1.2);

        groundGlow.intensity = (thrustMode === 'vtol') ? 4.5 : (thrustMode === 'boost') ? 3.0 : 1.2;
      }
    } else {
      pivot.position.y = 0;
      pivot.rotation.z = 0;
      groundGlow.intensity = 0.5;
    }

    renderer.render(scene, camera);
  })();

  // Initialize
  setSection('player');
})();
</script>
</body>
</html>
