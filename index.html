    <script>
      (function() {
        const video = document.getElementById('boot-bg-video');
        const boot = document.getElementById('boot');
        const enterBtn = document.getElementById('boot-enter-btn');
        const muteBtn = document.getElementById('boot-mute-btn');
        const soundLabel = muteBtn ? muteBtn.querySelector('.boot-sound-label') : null;
        if (!video || !boot) return;

        let userManuallyMuted = false;
        let activated = false;

        // Promise so the engine NEVER navigates to hangar until user actually clicks start/Enter
        let resolveUserStart;
        window.__USER_START_PROMISE__ = new Promise(function(resolve) {
          resolveUserStart = resolve;
        });

        function updateMuteUI(isMuted) {
          if (!muteBtn) return;
          if (isMuted) {
            muteBtn.classList.add('is-muted');
            if (soundLabel) soundLabel.textContent = 'Sound Off';
            muteBtn.setAttribute('title', 'Sound: OFF (Click to turn on)');
          } else {
            muteBtn.classList.remove('is-muted');
            if (soundLabel) soundLabel.textContent = 'Sound On';
            muteBtn.setAttribute('title', 'Sound: ON (Click to turn off)');
          }
        }

        // Default state: Sound ON
        video.muted = false;
        video.volume = 1.0;
        updateMuteUI(false);

        function enableSound() {
          userManuallyMuted = false;
          video.muted = false;
          video.volume = 1.0;
          try {
            const p = video.play();
            if (p !== undefined) {
              p.catch(function(err) {
                // If unmuted autoplay is blocked by browser policy on page transition, fallback to muted playback
                video.muted = true;
                video.play().catch(function() {});
                updateMuteUI(true);
              });
            }
          } catch (_) {
            video.muted = true;
            video.play().catch(function() {});
          }
          updateMuteUI(video.muted);
        }

        function disableSound() {
          userManuallyMuted = true;
          video.muted = true;
          updateMuteUI(true);
        }

        function activateWithSound() {
          if (activated) return;
          activated = true;

          // Transition to the loading state with video and meter
          boot.classList.add('loading-active');
          boot.classList.add('video-ready');

          // Reset progress meter to 0%
          const meterBar = document.querySelector('#boot .boot-line i');
          const meterPct = document.querySelector('#boot .boot-pct');
          if (meterBar) meterBar.style.transform = 'scaleX(0)';
          if (meterPct) meterPct.textContent = '0%';

          // Play video from beginning to end
          video.currentTime = 0;
          video.loop = false;

          if (!userManuallyMuted) {
            enableSound();
          } else {
            video.play().catch(function() {});
          }

          let meterAnimFrame = null;
          let transitionDone = false;

          function completeTransition() {
            if (transitionDone) return;
            transitionDone = true;
            if (meterAnimFrame) cancelAnimationFrame(meterAnimFrame);
            if (meterBar) meterBar.style.transform = 'scaleX(1)';
            if (meterPct) meterPct.textContent = '100%';
            try { sessionStorage.setItem('seen_intro', '1'); } catch (_) {}

            setTimeout(function() {
              if (resolveUserStart) {
                resolveUserStart();
                resolveUserStart = null;
              }
            }, 350);
          }

          function syncMeterWithVideo() {
            if (transitionDone) return;
            const dur = video.duration || 6.85;
            const cur = video.currentTime;
            const pct = Math.min(1, Math.max(0, cur / dur));
            if (meterBar) meterBar.style.transform = 'scaleX(' + pct.toFixed(3) + ')';
            if (meterPct) meterPct.textContent = Math.round(pct * 100) + '%';

            if (cur >= dur - 0.1 || video.ended) {
              completeTransition();
            } else {
              meterAnimFrame = requestAnimationFrame(syncMeterWithVideo);
            }
          }

          video.addEventListener('ended', completeTransition, { once: true });
          setTimeout(completeTransition, 7500);
          meterAnimFrame = requestAnimationFrame(syncMeterWithVideo);
        }

        // Check if launched directly from Garage / Hangar
        const urlParams = new URLSearchParams(window.location.search);
        const isRaceLaunch = urlParams.has('race') || urlParams.get('launch') === '1';

        if (isRaceLaunch) {
          boot.classList.add('loading-active');
          boot.classList.add('video-ready');
          const submark = document.querySelector('.boot-submark');
          if (submark) submark.textContent = 'Entering Third Mainland Bridge...';
          const meterStatus = document.querySelector('.boot-label span:first-child');
          if (meterStatus) meterStatus.textContent = 'Loading Track';
          
          // Auto-trigger video and loading meter screen immediately
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', activateWithSound);
          } else {
            activateWithSound();
          }
        }

        // Click to Enter button (for initial cold load)
        if (enterBtn) {
          enterBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            activateWithSound();
          });
        }

        // Press Enter on keyboard to start
        window.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            activateWithSound();
          }
        });

        // User toggle to mute or unmute
        if (muteBtn) {
          muteBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            e.preventDefault();
            if (video.muted) {
              enableSound();
            } else {
              disableSound();
            }
          });
        }

        // Stop video playback when boot overlay is closed/done
        const observer = new MutationObserver(function() {
          if (boot.classList.contains('done') || !document.body.contains(boot)) {
            try { video.pause(); } catch (_) {}
            observer.disconnect();
          }
        });
        observer.observe(boot, { attributes: true, attributeFilter: ['class'] });
      })();
    </script>

    <script>
    /* ── TOD (Time-Of-Day) Guardian — Bug 3 Fix ─────────────────────────
       Problem: window.__LAGOS_TOD__ is set once at boot from the URL param.
       On retry, _resetWorld() resets the scene to TOD=0 but __LAGOS_TOD__
       is still 'night', causing the next _play() tick to immediately force
       TOD=1.0 (night), making "day" look dark after several retries.
       Fix: re-assert __LAGOS_TOD__ correctly from localStorage every time
       the game calls start() / _resetWorld().
    ──────────────────────────────────────────────────────────────────── */
    (function patchTODGuardian() {
      // 1. Set __LAGOS_TOD__ immediately from URL param (may override any
      //    stale value left from a previous session on the same page load).
      (function applyTOD() {
        const tod = new URLSearchParams(location.search).get('tod')
                    || localStorage.getItem('lagos_time_of_day')
                    || 'day';
        window.__LAGOS_TOD__ = tod;
      })();

      // 2. Wait for the game object to exist, then wrap start() so that
      //    __LAGOS_TOD__ is refreshed from localStorage before _resetWorld.
      let _attempts = 0;
      function tryPatch() {
        const g = window.__GAME__ && window.__GAME__.game;
        if (!g) {
          if (++_attempts < 200) setTimeout(tryPatch, 100);
          return;
        }
        const origStart = g.start.bind(g);
        g.start = function() {
          // Re-read the authoritative TOD from localStorage on every retry
          const tod = new URLSearchParams(location.search).get('tod')
                      || localStorage.getItem('lagos_time_of_day')
                      || 'day';
          window.__LAGOS_TOD__ = tod;
          // Also sync to the world immediately so _resetWorld's setTimeOfDay(0)
          // then gets overridden by the correct value on first _play() tick
          if (g.world && typeof g.world.setTimeOfDay === 'function') {
            g.world.setTimeOfDay(tod === 'night' ? 1.0 : 0);
            g.lastTod = (tod === 'night' ? 1.0 : 0);
          }
          return origStart();
        };
        console.log('[TODGuardian] Patched — TOD:', window.__LAGOS_TOD__);
      }
      setTimeout(tryPatch, 500);
    })();
    </script>

    <!-- ── Expose boardMats for ad-manager.js ───────────────────────────────
         Waits for window.__GAME__.game.world to be ready, then publishes
         world.boardMats on window.__lsrWorld so ad-manager.js can swap
         billboard textures without touching the engine bundle.
    ─────────────────────────────────────────────────────────────────────── -->
    <script>
    (function exposeWorldForAds() {
      var _attempts = 0;
      function tryExpose() {
        var g = window.__GAME__ && window.__GAME__.game;
        var world = g && g.world;
        if (world && world.boardMats && world.boardMats.length) {
          window.__lsrWorld = { boardMats: world.boardMats };
          console.log('[LSR Ads] __lsrWorld exposed — ' + world.boardMats.length + ' billboard mats.');
          return;
        }
        if (++_attempts < 300) setTimeout(tryExpose, 100);
      }
      setTimeout(tryExpose, 800);
    })();
    </script>
